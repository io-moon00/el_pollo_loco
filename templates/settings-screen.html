<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Settings</title>
        <link rel="stylesheet" href="../styles/main.css">
        <link rel="stylesheet" href="../styles/mobile.css">
        <link rel="stylesheet" href="../styles/info-page.css">
        <link rel="shortcut icon" href="../img/3_enemies_chicken/chicken_normal/1_walk/1_w.png" type="image/x-icon">
        <link rel="stylesheet" href="https://use.typekit.net/wmt6kfx.css">
        <script src="../js/settings.js"></script>
    </head>

    <body onload="loadSettings()" style="background-image: url(../img/game-background.png);">
        <div class="wrapper">
            <div class="help-screen settings-screen">
                <h1>
                    <img src="../img/6_salsa_bottle/1_salsa_bottle_on_ground.png" alt=""> El Pollo Loco – Settings
                </h1>

                <div class="settings-instructions">
                    <span>Sound</span>
                    <label class="switch">
                        <input type="checkbox" onchange="saveSettings()" type="checkbox" id="sound" name="sound" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="settings-instructions">
                    <span>Music</span>
                    <label class="switch">
                        <input type="checkbox" onchange="saveSettings()" type="checkbox" id="music" name="music" checked>
                        <span class="slider round"></span>
                    </label> 
                </div>

                <div class="back-btn-container">
                    <a href="../index.html">
                        <svg class="" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12l4-4m-4 4 4 4"/>
                        </svg>
                        Back to Game
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
